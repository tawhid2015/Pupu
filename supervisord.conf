[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ytcipher]
command=/usr/local/bin/deno run --no-check --allow-net --allow-read --allow-write --allow-env server.ts
directory=/app/lavalink/yt-cipher
environment=API_TOKEN="pupu-cipher-2026",OVERRIDE_PLAYER_VARIANT="IAS",PORT="8002",HOST="0.0.0.0"
autostart=true
autorestart=true
startsecs=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:lavalink]
command=java -Xmx512M -XX:+UseG1GC -jar /app/lavalink/Lavalink.jar
directory=/app/lavalink
autostart=true
autorestart=true
startsecs=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pupu_bot]
command=python /app/backend/pupu_bot.py
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:server]
command=sh -c "uvicorn server:app --host 0.0.0.0 --port ${PORT:-8001}"
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
