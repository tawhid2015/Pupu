# ── Lavalink v4 configuration ────────────────────────────────────────────────
# Works locally AND on Railway:
#   • ${PORT:2333}                → Railway injects PORT; falls back to 2333 locally
#   • ${LAVALINK_PASSWORD:pupu2026} → override on Railway via env var LAVALINK_PASSWORD
server:
  port: ${PORT:2333}
  address: 0.0.0.0
lavalink:
  server:
    password: ${LAVALINK_PASSWORD:pupu2026}
    sources:
      youtube: false          # built-in is empty in v4 — the youtube-plugin handles it
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # OAuth (device-code, burner Google account) is the primary YouTube auth.
    # Do NOT combine with pot/poToken — they conflict ("The page needs to be reloaded").
    oauth:
      enabled: true
      refreshToken: "1//0471mvG7nh6JiCgYIARAAGAQSNwF-L9IrzdUmBpt4EiG1BiebJBwgGBgTRFUwpv1q2VfhQrH1dYcjcIVZtiov5UllznP5ZFVdbgQ"
    clients:
      - TV
      - MUSIC
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR
      - IOS
    # TV (OAuth) can't search/load playlists — reserve it for playback only.
    clientOptions:
      TV:
        playback: true
        videoLoading: true
        playlistLoading: false
        searching: false
      MUSIC:
        playback: true
        videoLoading: true
        playlistLoading: true
        searching: true
      WEB:
        playback: true
        videoLoading: true
        playlistLoading: true
        searching: true
    # Remote cipher server (decrypts YouTube SABR signatures). Self-hosted yt-cipher.
    remoteCipher:
      url: "http://localhost:8002"
      password: "pupu-cipher-2026"
      userAgent: "pupu"
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
sentry:
  dsn: ""
  environment: ""
logging:
  level:
    root: INFO
    lavalink: INFO
