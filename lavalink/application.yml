# ── Lavalink v4 configuration ────────────────────────────────────────────────
# Works locally AND on Railway:
#   • ${PORT:2333}                → Railway injects PORT; falls back to 2333 locally
#   • ${LAVALINK_PASSWORD:pupu2026} → override on Railway via env var LAVALINK_PASSWORD
server:
  port: ${PORT:2333}
  address: 0.0.0.0
lavalink:
  server:
    password: ${LAVALINK_PASSWORD:pupu2026}
    sources:
      youtube: false          # built-in is empty in v4 — the youtube-plugin handles it
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # poToken + visitorData let the WEB/WEBEMBEDDED clients pass YouTube's bot-check on
    # datacenter IPs. Refresh with /app/lavalink/refresh_potoken.py when playback fails.
    pot:
      token: "MsIE12rH5l4DMTDXVPqZ4AspFSAj26qA8ZZju59zuKWqASw9QAYgqM_tt9gBe6TUuNp0vSpWd6bnuHWKhe2CFa6fIKKfJU_wH3j75XvPD_nYlpjx33PfrdnDCy70ndCJn86YolHm9dnr0wVwGu8gbnzR8Noy3l6UJjnf7lzSaC3cPh9kF1-buc-mBsrmD69UhEMaMlW8LTaZ6WhRzQA0udDb2qdisoC1YzDiLAXo8fITlt7DH0fq_V-Fmo6qVUxdJ_54VsUhRfowlbeu3uixdB8NndONSXLKdWRhlMyGkTbodeIxuzx_6LvrVhbDW-G-FHPg2zBQ-HCQAOl2jiY7IdMGc36fdFFAHhKqhB_iXivG8k3gPONGP8X-STyFTDcOw0XMms_H9e2UeXD8rC4E-9B8vgDlDfVIPH0YM12ZjILc65q-U60jd5QD2nuSmwYcZiX1j8H7to71rgea2s24UvYX7j7A3R3f5ycj6QhMhG0ggGfhvCXfsCoc5I1KHCYlWrvdknaDyOl-p2EejzaK6Epu6RVV2UT7C2vZwWfX_QQn4-ByNdpvcQ23CT0uyao8C43JeKCdmMCBCOMBFeWk5mYqybpRBPzninVfIhmzTVl_DDGxC5le2FYIVhKvSkdcCidCJ7h1ZVQq9gPl7S_5bP1AS_L5zsAZqBhIjvPHT8BrVFxOLbmR9QwLwgMnCs8pib9E5usbr2VViL4oKJkw4jAMbBIlmyyULJcbal7LAJSi08bJEHnC-3orQvo-p9BZOElEAPE="
