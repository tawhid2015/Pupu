# ── Lavalink v4 configuration ────────────────────────────────────────────────
# Works locally AND on Railway:
#   • ${PORT:2333}                → Railway injects PORT; falls back to 2333 locally
#   • ${LAVALINK_PASSWORD:pupu2026} → override on Railway via env var LAVALINK_PASSWORD
server:
  port: ${PORT:2333}
  address: 0.0.0.0
lavalink:
  server:
    password: ${LAVALINK_PASSWORD:pupu2026}
    sources:
      youtube: false          # built-in is empty in v4 — the youtube-plugin handles it
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Clients that currently survive YouTube bot-checks; update when youtube-plugin releases
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
sentry:
  dsn: ""
  environment: ""
logging:
  level:
    root: INFO
    lavalink: INFO
