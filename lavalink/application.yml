# ── Lavalink v4 configuration ────────────────────────────────────────────────
# Works locally AND on Railway:
#   • ${PORT:2333}                → Railway injects PORT; falls back to 2333 locally
#   • ${LAVALINK_PASSWORD:pupu2026} → override on Railway via env var LAVALINK_PASSWORD
server:
  port: ${PORT:2333}
  address: 0.0.0.0
lavalink:
  server:
    password: ${LAVALINK_PASSWORD:pupu2026}
    sources:
      youtube: false          # built-in is empty in v4 — the youtube-plugin handles it
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # poToken + visitorData let the WEB/WEBEMBEDDED clients pass YouTube's bot-check on
    # datacenter IPs. Refresh with /app/lavalink/refresh_potoken.py when playback fails.
    pot:
      token: "MsIEQreqEa2FRWhCiQNhaHWnalL2YxKl2zw21Takaf-N3ec35iLZkZX8VWebiNbWm6F6Ug0tlf6_P7ckmYeAuFrQ1sPgCRYYHQ9sMgl5MYkEbSfy8aQaFlGB0pFUbIDiYUSvfqgc_j2P0ijaSkh6gZUWIlmNzi1DbdBINW6gIWE6zfyuKdwe_0rw-76VD0xwVg9mSI1K1U0UWIqjPR7_asHmsEkoEAYNoTAlulznZLycG9-5Mn9kR9Fnt-Bys37stku-ur7hJvUC3Rv-lQn0EUDba_QojFTtozs625kCZVUKLaFUYunTHTQWV_jgT5n3gAAcWIywskJZ984tdeYA_XUpfme-FNiSP8Yyj_Bfm9lOltBLZrt8-aDlEeCKYkSo5bB41MFjeQ0Yzh0YYwNHXXtQaufspRdunnegHg_i0R8jw-1lPuPKQ2ac2lRoBdGI_3RMCf61kiPwYNEuEYTqOpBcU0bkgtiuRLkz1aW9Z3cYu7IkODRVSrdLjX8y2iuhYKaHZWDrnVVSXvgDn9jrYasm8-8Eww2KNxZFITkcKJsjVJ8dMOC9VPtcTGvaeVpInsst4Em8lRU4o5zlhvdV9KbzBbgiwSVwsJ5pu9_mL0GCnaJPP5XRy5sSnpnLB7J_y2MPwGlclC95LEa53peP6EO3eia-24IxpOnOqtFLBr12Rr6BlTrVIVEBWYN5Uo_UGopGIufpyvdwk5YGhXZvS-IUeExhEBRWgM1QzANVeeQEAFDzOH0kEs01m0E0-Fmpjn_oifI="
      visitorData: "%3D%3D"
    # Clients that currently survive YouTube bot-checks; update when youtube-plugin releases
    # OAuth: one-time device-code sign-in (burner Google account recommended).
    # On Lavalink start, the log prints a verification URL + code. After authorizing,
    # a refresh token is printed once — save it here as refreshToken for persistence.
    oauth:
      enabled: true
      refreshToken: null
    clients:
      - TV
      - IOS
      - MUSIC
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR
    # Remote cipher server (decrypts YouTube SABR signatures). Self-hosted yt-cipher.
    remoteCipher:
      url: "http://localhost:8002"
      password: "pupu-cipher-2026"
      userAgent: "pupu"
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
sentry:
  dsn: ""
  environment: ""
logging:
  level:
    root: INFO
    lavalink: INFO
