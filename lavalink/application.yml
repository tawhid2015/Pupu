    # WEB/WEBEMBEDDED are poToken-backed; MUSIC/ANDROID_VR/TVHTML5EMBEDDED add resilience.
    clients:
      - MUSIC
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR
metrics:
